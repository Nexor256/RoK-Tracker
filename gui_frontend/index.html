<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <title>RoK Tracker Suite</title>
  </head>
  <body>
    <script>
      (function () {
        var stored = localStorage.getItem('vueuse-color-scheme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark))
          document.documentElement.classList.add('dark');

        // Restore premade theme class early to prevent flash
        var validThemes = ['default', 'aurora', 'spectrum', 'glass', 'cyberpunk', 'luxe'];
        var theme = localStorage.getItem('theme-name');
        if (theme) {
          try {
            var parsed = JSON.parse(theme);
            if (parsed && parsed !== 'default' && validThemes.indexOf(parsed) !== -1)
              document.documentElement.classList.add('theme-' + parsed);
          } catch(e) {}
        }
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
